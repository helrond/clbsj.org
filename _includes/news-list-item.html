{% include news-series-by-name.html name=item.series %}
<div class="callout">
  <h4>
    <a href="{{item.url}}">{{item.title}}</a>
  </h4>
  {% if series %}
  {% for item in series %}
      <span class="label label-orange label-series">
        <a href="{{item.url}}">{{ item.title }}</a>
      </span>
    {% endfor %}
  {% endif %}
  <p>{%- if item.series == 'from-the-stacks' -%}Reviewed by {% endif %}{{item.author}}</p>
  <p>{{description}}</p>
  <a class="hollow button small" href="{{item.url}}">Read More</a>
</div>
