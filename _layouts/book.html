---
layout: default
---
<div class="small-8 small-offset-2">
  <h1>{{ page.title }}</h1>
  <p>{{page.byline}}<br/>
    {{page.publication_date}}</p>
  <div class="book__wrapper">
    <div class="book__image">
      <img alt="Cover of {{page.title}}" src="/img/{{page.cover_image}}"/>
    </div>
    
    <div class="book__text">
      {{page.content | markdownify}}
    </div>
  </div>
  <a class="primary donate button" href="{{page.purchase_url}}">Purchase from Wipf & Stock</a>
</div>
